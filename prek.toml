# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files" },
  { id = "check-merge-conflict" },
  { id = "check-yaml" },
  { id = "end-of-file-fixer" },
  { id = "trailing-whitespace" }
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "swift-format",
    name = "Swift lint and format check",
    entry = "swift format lint --strict",
    language = "system",
    files = '\.swift$'
  },
  {
    id = "ruff-check",
    name = "Python lint",
    entry = "ruff check",
    language = "system",
    types = ["python"]
  },
  {
    id = "ruff-format",
    name = "Python format check",
    entry = "ruff format --check",
    language = "system",
    types = ["python"]
  },
  {
    id = "e2e",
    name = "Release CLI and Assuan E2E",
    entry = "uv run scripts/e2e.py",
    language = "system",
    pass_filenames = false,
    always_run = true,
    require_serial = true
  }
]
